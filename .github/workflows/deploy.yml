name: Deploy para HostGator

# Roda a cada push na branch main (ou manualmente pelo botão "Run workflow")
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do site (Astro -> dist/)
        run: npm run build

      - name: Enviar dist/ por FTP para o HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Pasta local que será enviada (saída do build)
          local-dir: ./dist/
          # Pasta de destino no servidor. Em geral é a raiz do domínio:
          #   ./public_html/        (domínio principal)
          #   ./public_html/sub/    (subdomínio ou subpasta)
          server-dir: /ramonantonio.adv.br/
          # Protocolo: "ftp" simples (HostGator costuma aceitar melhor a partir de servidores externos).
          protocol: ftp
          timeout: 60000
